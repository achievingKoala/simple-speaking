<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Speak Daily · 雅思口语词汇练习</title>
<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
<style>
:root{color-scheme:light;font-family:Inter,system-ui,"PingFang SC",sans-serif;color:#28213a;background:#f7f5fb}
*{box-sizing:border-box}body{margin:0}button{font:inherit;cursor:pointer}button:focus-visible{outline:3px solid #8156d8;outline-offset:4px}button:disabled{cursor:default;opacity:.52}[hidden]{display:none!important}
header{background:#fff;border-bottom:1px solid #e8e1f1}.shell{max-width:1024px;margin:auto;padding-inline:24px}.bar{min-height:74px;display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{display:flex;align-items:center;gap:10px;font-weight:800}.mark{display:grid;place-items:center;width:38px;height:38px;border-radius:13px;background:#6740bb;color:white}.mark svg,.primary svg{width:19px;height:19px}.totals{display:flex;gap:20px;font-size:12px;color:#625972}.totals strong{display:block;font-size:19px;color:#322645}
main{padding-block:40px 32px}.intro{padding:30px 32px;border:1px solid #e4d8fa;border-radius:24px;background:linear-gradient(115deg,#eee5ff,#f8f3ff 72%)}.eyebrow{font-size:12px;font-weight:800;color:#6740aa;letter-spacing:.08em}.intro h1{margin:8px 0;font-size:clamp(26px,5vw,39px);letter-spacing:-.045em;line-height:1.25}.intro p,.subtle{color:#615771;font-size:14px}.intro p{margin:0}
.layout{display:grid;grid-template-columns:252px minmax(0,1fr);gap:20px;margin-top:22px}.panel{background:#fff;border:1px solid #e8e1f0;border-radius:20px;padding:22px}.topics h2{margin:0 0 15px;font-size:17px}.topic{display:flex;align-items:center;gap:11px;text-align:left;width:100%;background:white;color:inherit;border:1px solid #ede7f5;border-radius:13px;padding:11px;margin-top:9px}.topic:hover,.topic[aria-pressed=true]{background:#f3ecff;border-color:#cdb9ef}.topic b,.topic small{display:block}.topic small{color:#625773;margin-top:3px}.topic-icon{background:#ece3fa;border-radius:9px;width:34px;height:34px;display:grid;place-items:center}
.practice{min-height:382px}.row{display:flex;align-items:center;justify-content:space-between;gap:12px}.label{font-size:13px;font-weight:750;color:#614296}.counter{font-variant-numeric:tabular-nums;font-size:13px;color:#615771}.progress{width:100%;height:7px;border:0;margin-top:10px;appearance:none;border-radius:10px;overflow:hidden;background:#eee8f7}.progress::-webkit-progress-bar{background:#eee8f7}.progress::-webkit-progress-value{background:#7850cd}.progress::-moz-progress-bar{background:#7850cd}
.center{text-align:center;padding-top:31px}.word{font-size:clamp(26px,5vw,43px);line-height:1.15;margin:10px 0;color:#281942;overflow-wrap:anywhere;letter-spacing:-.035em}.meaning{margin:0 0 22px;color:#655776}.primary,.secondary{border-radius:11px;padding:10px 16px;min-height:44px;font-weight:750;border:1px solid transparent}.primary{background:#653bb8;color:white;display:inline-flex;align-items:center;justify-content:center;gap:8px}.primary:hover:enabled{background:#532da1}.secondary{background:#f6f1fe;color:#5b389c;border-color:#e8ddf8}.actions{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}.feedback{margin:13px auto 0;min-height:24px;font-size:14px;color:#655776;overflow-wrap:anywhere}.feedback[data-kind=correct]{color:#176540}.feedback[data-kind=wrong]{color:#a33635}.note{margin:17px 0 0;text-align:center;font-size:12px;color:#655a74}.wrong-list{list-style:none;margin:16px 0;padding:0;max-height:230px;overflow:auto;text-align:left}.wrong-list li{padding:7px 9px;border-bottom:1px solid #efe9f6;font-size:14px}
@media(max-width:690px){.shell{padding-inline:15px}main{padding-block:22px}.layout{grid-template-columns:1fr;gap:12px}.intro,.panel{padding:17px}.topic-list{display:grid;grid-template-columns:1fr 1fr;gap:6px}.topic{margin:0;padding:7px;gap:6px}.topic-icon{width:26px;height:28px}.totals{gap:9px}.topics h2{margin-bottom:10px}.center{padding-top:24px}}
.topic-list{display:grid;gap:8px}.topic-card{padding:10px;border:1px solid #ede7f5;border-radius:13px}.topic-heading{display:flex;align-items:center;gap:8px;margin:0;font-size:14px}.topic-heading small{display:block;margin-top:2px;color:#625773;font-weight:400}.topic-icon{flex-shrink:0}.practice-types{display:flex;gap:6px;margin-top:8px}.practice-types button{flex:1;padding:6px;font-size:14px;background:white}.practice-types button:hover{background:#f3ecff;border-color:#cdb9ef}.practice-types button[aria-pressed=true]{background:#653bb8;border-color:#653bb8;color:white}
.preview{padding-top:14px}.preview h2{margin:0;font-size:20px}.preview-list{margin:10px 0 16px;padding:0;list-style:none}.preview-list li{display:flex;flex-wrap:wrap;justify-content:space-between;gap:4px 16px;padding:7px 0;border-bottom:1px solid #efe9f6;font-size:14px}.preview-list span{color:#655776}
</style>
</head>
<body>
<header><div class="shell bar">
<div class="brand"><span class="mark" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 10v4m4-7v10m5-14v18m5-14v10m4-7v4"/></svg></span> Speak Daily</div>
<div class="totals"><div><strong id="total-correct">0</strong>累计正确</div><div><strong id="total-attempts">0</strong>总练习次数</div></div>
</div></header>
<main class="shell">
<section class="intro"><div class="eyebrow">IELTS SPEAKING</div><h1>雅思口语词汇练习</h1><p>选一个话题，单词和词组分开练，每轮 10 个。</p></section>
<div class="layout">
<aside class="panel topics">
<h2>选择话题</h2><div id="topics" class="topic-list"></div>
<div style="margin-top:18px">
<label for="provider" class="label">语音识别方式</label>
<select id="provider" class="topic" aria-describedby="provider-note">
<option value="tencent" selected>腾讯云识别</option>
<option value="browser">浏览器识别</option>
</select>
<p id="provider-note" class="subtle">短录音会通过本站发送到腾讯云进行识别。</p>
</div>
</aside>
<section class="panel practice" aria-label="口语练习">
<div class="row"><span class="label" id="round-label"></span><span class="counter" id="round-timer" hidden>用时 <span id="round-time">00:00</span></span><span class="counter" id="counter"></span></div>
<p class="subtle"><label><input id="show-english" type="checkbox" checked> 显示英文题目</label></p>
<progress id="progress" class="progress" aria-label="本轮完成进度" hidden></progress>
<div id="preview" class="preview" hidden>
<h2 id="preview-title" tabindex="-1">本轮词表</h2>
<ul id="preview-list" class="preview-list"></ul>
<button class="primary" id="start" type="button">开始练习</button>
</div>
<div id="question" class="center" hidden>
<div class="eyebrow">请用英文朗读</div>
<h2 id="word" class="word" lang="en" tabindex="-1"></h2><p id="meaning" class="meaning" tabindex="-1"></p>
<p id="word-stats" class="subtle" aria-label="当前词条的练习记录"></p>
<div class="actions">
<button class="primary" id="listen" type="button"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="9" y="2" width="6" height="13" rx="3"/><path d="M5 10v2a7 7 0 0 0 14 0v-2m-7 9v3m-3 0h6"/></svg><span id="listen-label">开始朗读</span></button>
<button class="primary" id="next" type="button" hidden>下一题</button>
<button class="secondary" id="pause" type="button">暂停</button>
</div>
<p class="feedback" id="feedback" role="status"></p>
<p class="note">语音转写与目标词条匹配即为正确。练习次数按有效识别结果累计。</p>
</div>
<div id="result" class="center" hidden>
<h2 class="word" id="result-title" tabindex="-1">练习完成</h2>
<p class="meaning" id="result-score"></p>
<p class="subtle" id="result-time"></p>
<ul id="wrong-list" class="wrong-list" aria-label="本轮错词"></ul>
<div class="actions"><button class="primary" id="retry" type="button">重练错词</button><button class="secondary" id="restart" type="button">再练一轮</button></div>
</div>
</section>
</div>
<p class="note" id="storage-note">练习统计保存在当前浏览器。</p>
</main>
<script src="tencent-recognition.js" defer></script>
<script src="app.js" defer></script>
</body>
</html>
